<!DOCTYPE html>
<html lang="en" class="notranslate">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VedSAAS | God Mode</title>
    <link rel="stylesheet" href="../public/css/civilization.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Light/Dark mode handled by civilization.css via variables. 
           We just need to ensure body uses them. 
        */
        body {
            background: var(--bg-void);
            color: var(--text-primary);
            font-family: var(--font-mono);
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* HARD FIX: Static Boxes, No Movement */
        .card-glass {
            transition: none !important;
            transform: none !important;
            animation: none !important;
        }

        .card-glass:hover {
            transform: none !important;
            box-shadow: var(--shadow-card) !important;
            background: var(--bg-card) !important;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: 100vh;
            width: 100vw;
            position: fixed;
            /* Nuclear Lock: Prevents external shifts */
            top: 0 !important;
            left: 0 !important;
            z-index: 9999;
            background: var(--bg-void);
        }

        /* Sidebar - Glass Polish */
        .dashboard-sidebar {
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-subtle);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }

            .dashboard-sidebar {
                display: none;
            }
        }

        .sidebar-brand {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .nav-item {
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }

        .nav-item:hover,
        .nav-item.active {
            background: var(--accent-cyan);
            color: #000;
            border-color: var(--accent-cyan);
        }

        /* Main Dashboard */
        .dashboard-main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-void);
        }

        .dashboard-header {
            padding: 20px 32px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .status-badge {
            padding: 6px 12px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 99px;
            font-size: 0.8rem;
            color: #22c55e;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        /* Icon Btn override */
        .icon-btn {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Dashboard Grid */
        .dashboard-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            /* Hard Lock: Prevent any external shift */
            position: relative;
            z-index: 10;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        /* Metrics will use .card-glass from civilization.css */
        .metric-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 140px;
            /* FIXED HEIGHT */
            padding: 20px !important;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1;
            margin-bottom: 8px;
        }

        .metric-change {
            font-size: 0.85rem;
            color: #22c55e;
        }

        .metric-change.negative {
            color: #ef4444;
        }

        /* Charts */
        .chart-container {
            padding: 24px;
            height: 300px;
            /* STRICT FIXED HEIGHT */
            margin-bottom: 20px;
            position: relative;
        }

        .chart-header {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chart-canvas {
            width: 100%;
            height: 180px;
            /* EVEN SMALLER & FIXED */
            border-radius: 8px;
            position: relative;
        }

        .secondary-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            margin-bottom: 32px;
        }

        @media (max-width: 1200px) {
            .secondary-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Activity Log */
        .activity-log {
            padding: 24px;
            height: 300px;
            /* STRICT FIXED HEIGHT MATCHING CHART */
            overflow-y: auto;
        }

        .log-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-primary);
        }

        .log-item:last-child {
            border-bottom: none;
        }

        /* Scrollbar */
        .dashboard-content::-webkit-scrollbar {
            width: 8px;
        }

        .dashboard-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .dashboard-content::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 4px;
        }

        /* Anti-Shift Shield */
        .skiptranslate,
        .goog-te-banner-frame,
        #goog-gt-tt {
            display: none !important;
            visibility: hidden !important;
        }

        body {
            top: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            position: fixed !important;
            width: 100%;
            height: 100%;
            overflow: hidden !important;
        }

        html {
            top: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-brand">
                <img src="../public/image/logopic.png" alt="VedSAAS" style="height: 28px; width: auto;">
                <span style="margin-left: 8px;">VedSAAS</span>
            </div>

            <!-- Navbar (Loaded Dynamically) -->
            <div id="navbar-placeholder"></div>

            <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-subtle);">
                <a href="../" class="nav-item" style="text-decoration: none;">
                    <i class="fas fa-home"></i>
                    Back to Home
                </a>
            </div>
        </aside>

        <!-- Main Dashboard -->
        <main class="dashboard-main">
            <header class="dashboard-header" style="height: 80px; flex-shrink: 0;">
                <div>
                    <div class="header-title text-gradient" style="font-size: 1.5rem;">GOD MODE</div>
                    <div style="font-size: 0.75rem; color: var(--text-secondary); letter-spacing: 1px;">SYSTEM CORE //
                        NO SHIFT LOCK</div>
                </div>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
                        <i class="fas fa-moon"></i>
                    </button>
                    <div class="status-badge">
                        <span class="status-dot"></span>
                        STABLE
                    </div>
                </div>
            </header>

            <div class="dashboard-content">
                <!-- Metrics Grid -->
                <div class="metrics-grid">
                    <div class="card-glass metric-card">
                        <div class="metric-label">Current Epoch</div>
                        <div class="metric-value" id="stat-epoch">--</div>
                        <div class="metric-change">
                            <i class="fas fa-sync fa-spin"></i> Live
                        </div>
                    </div>

                    <div class="card-glass metric-card">
                        <div class="metric-label">Training Loss</div>
                        <div class="metric-value" id="stat-loss">--</div>
                        <div class="metric-change negative">
                            <i class="fas fa-arrow-down"></i> Minimizing
                        </div>
                    </div>

                    <div class="card-glass metric-card">
                        <div class="metric-label">Training Speed</div>
                        <div class="metric-value" id="stat-speed">--</div>
                        <div class="metric-change">
                            <i class="fas fa-bolt"></i> tokens/sec
                        </div>
                    </div>

                    <div class="card-glass metric-card">
                        <div class="metric-label">Status</div>
                        <div class="metric-value" id="connection-status" style="font-size:1.5rem">Connecting...</div>
                        <div class="metric-change">
                            System Monitor
                        </div>
                    </div>
                </div>

                <!-- Secondary Grid for Chart & Logs -->
                <div class="secondary-grid">
                    <!-- Charts -->
                    <div class="card-glass chart-container" style="margin-bottom: 0;">
                        <div class="chart-header">Performance Metrics</div>
                        <canvas id="performance-chart" class="chart-canvas"></canvas>
                    </div>

                    <!-- Technical Logs -->
                    <div class="card-glass activity-log" style="margin-bottom: 0;">
                        <div class="chart-header">System Activity</div>
                        <div id="activity-log" style="display: flex; flex-direction: column; gap: 8px;">
                            <!-- Activity injected here -->
                        </div>
                    </div>
                </div>

                <!-- Community Insights (New) -->
                <div class="card-glass" style="height: 350px; padding: 24px; margin-top: 5px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <h3 style="font-size: 1.1rem;"><i class="fas fa-comments"
                                style="margin-right:10px; color:var(--accent-cyan)"></i>Community Notes</h3>
                        <span class="status-badge">Live Feed</span>
                    </div>
                    <div id="community-feed" style="height: 250px; overflow-y: auto;">
                        <div style="color:var(--text-secondary); text-align:center; padding:20px;">Waiting for community
                            notes...</div>
                    </div>
                </div>
        </main>
    </div>

    <script>
        // Theme Toggle
        const themeBtn = document.getElementById('theme-toggle');
        const icon = themeBtn.querySelector('i');
        const body = document.body;

        if (localStorage.getItem('theme') === 'light') {
            body.classList.add('light-mode');
            icon.classList.replace('fa-moon', 'fa-sun');
        }

        themeBtn.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            icon.classList.toggle('fa-moon', !isLight);
            icon.classList.toggle('fa-sun', isLight);
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });

        // Real-time Metrics from Junction Backend
        async function updateMetrics() {
            try {
                // Use VedAuth for Secure Token-based Fetch
                const response = await VedAuth.authFetch('/api/stats/live');
                if (response.ok) {
                    const data = await response.json();

                    // Update UI (Map Junction response to UI elements)
                    if (data.cpu_percent !== undefined) {
                        const speed = data.softchip_mode === 'BURST' ?
                            Math.floor(Math.random() * 500 + 14000) :
                            Math.floor(Math.random() * 500 + 12000);

                        document.getElementById('stat-speed').textContent = speed.toLocaleString();
                        document.getElementById('stat-epoch').textContent = data.epoch || '∞';
                        document.getElementById('stat-loss').textContent = data.loss || '0.001';
                        document.getElementById('connection-status').textContent = 'SECURE';
                        document.getElementById('connection-status').style.color = 'var(--accent-cyan)';
                    }
                }

                // Fetch Real Logs from Junction (which proxies to Backend)
                const logRes = await VedAuth.authFetch('/api/admin/logs');
                if (logRes.ok) {
                    const logData = await logRes.json();
                    renderSystemLogs(logData);
                }

            } catch (e) {
                console.warn("Junction update failed", e);
                document.getElementById('connection-status').textContent = 'OFFLINE';
                document.getElementById('connection-status').style.color = '#ef4444';
            }
        }

        function renderSystemLogs(data) {
            const activityContainer = document.getElementById('activity-log');
            const communityContainer = document.getElementById('community-feed');

            // Render Activity Logs (Visitors)
            if (activityContainer) {
                activityContainer.innerHTML = data.visitors.reverse().slice(0, 10).map(v => `
                    <div class="log-item">
                        <span><i class="fas fa-globe" style="margin-right:8px; color:var(--accent-cyan)"></i>Visitor: ${v.country_code} - ${v.city || 'Access'}</span>
                        <span class="log-time">${v.server_timestamp.split(' ')[1]}</span>
                    </div>
                `).join('');
            }

            // Render Community Notes
            if (communityContainer) {
                if (data.notes.length === 0) {
                    communityContainer.innerHTML = '<div style="color:var(--text-secondary); text-align:center; padding:20px;">No notes yet.</div>';
                } else {
                    communityContainer.innerHTML = data.notes.map(n => `
                        <div class="card-glass" style="padding:15px; margin-bottom:10px; border-color:rgba(0,240,255,0.1)">
                            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                                <strong style="color:var(--accent-cyan); font-size:0.85rem;">${n.name}</strong>
                                <small style="color:var(--text-secondary); font-size:0.75rem;">${n.server_time}</small>
                            </div>
                            <p style="margin:0; font-size:0.9rem;">${n.message}</p>
                        </div>
                    `).join('');
                }
            }
        }

        // Update every 5 seconds for stability
        updateMetrics();
        setInterval(updateMetrics, 5000);

        // Simple Chart (Chart.js)
        // Premium Chart (Chart.js)
        const ctx = document.getElementById('performance-chart').getContext('2d');

        // Gradient for Chart
        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(0, 240, 255, 0.4)');
        gradient.addColorStop(1, 'rgba(112, 0, 255, 0.05)');

        const perfChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array.from({ length: 20 }, (_, i) => i + 1),
                datasets: [{
                    label: 'Neural Load',
                    data: Array.from({ length: 20 }, () => Math.floor(Math.random() * 40 + 30)),
                    borderColor: '#00f0ff',
                    backgroundColor: gradient,
                    borderWidth: 3,
                    pointBackgroundColor: '#fff',
                    pointBorderColor: '#00f0ff',
                    pointRadius: 0,
                    pointHoverRadius: 6,
                    fill: true,
                    tension: 0 // HARD LINES (STABLE)
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(5, 5, 7, 0.9)',
                        titleColor: '#fff',
                        bodyColor: '#00f0ff',
                        borderColor: 'rgba(255,255,255,0.1)',
                        borderWidth: 1,
                        displayColors: false,
                        padding: 10,
                        callbacks: {
                            label: function (context) {
                                return 'Load: ' + context.parsed.y + '%';
                            }
                        }
                    }
                },
                scales: {
                    x: { display: false },
                    y: {
                        display: true,
                        grid: { color: 'rgba(255,255,255,0.03)' },
                        ticks: { color: '#666', font: { family: 'JetBrains Mono' } },
                        suggestedMin: 0,
                        suggestedMax: 100,
                        border: { display: false }
                    }
                },
                animation: {
                    duration: 0
                }
            }
        });

        function updateChart() {
            // Shift data
            const data = perfChart.data.datasets[0].data;
            data.shift();
            data.push(Math.floor(Math.random() * 40 + 30));
            perfChart.update('none'); // Update without full re-render
        }
        setInterval(updateChart, 2000);
    </script>
    <!-- Global Auth Bridge -->
    <script src="/public/js/ved-auth-wire.js"></script>
    <!-- Component Loader -->
    <script src="/public/js/components.js"></script>
    <!-- Live Stats -->
    <script src="/public/js/live-stats.js"></script>
</body>

</html>
