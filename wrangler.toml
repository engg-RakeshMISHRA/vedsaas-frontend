name = "vedsaas-frontend"
compatibility_date = "2024-09-23"

# Cloudflare Worker (2026-10-20): /api/* → backend proxy (worker.js), baaki sab static pages.
# Kya upload nahi hota, wo .assetsignore me hai (node_modules, scripts, android, logs...).
main = "worker.js"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api", "/api/*"]

[vars]
# VedSAAS backend ka pata — Cloudflare Tunnel (is PC ka Junction/backend). Tunnel banne ke baad yahi naam.
API_ORIGIN = "https://vedsaas-api.vedkuber.in"
